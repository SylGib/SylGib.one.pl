<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Mapa MPK Kraków – GTFS‑RT</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
    body, html { margin: 0; height: 100%; }
    #map { height: 100%; }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gtfs-realtime-bindings/dist/gtfs-realtime-bindings.min.js"></script>
<script>
  const map = L.map('map').setView([50.0647, 19.9450], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // Obiekty do przechowywania markerów pojazdów
  const busMarkers = {};
  const tramMarkers = {};

  async function loadGTFSRT(url, markers, color) {
    try {
      const res = await fetch(url);
      const arrayBuffer = await res.arrayBuffer();
      const feed = GtfsRealtimeBindings.FeedMessage.decode(new Uint8Array(arrayBuffer));

      feed.entity.forEach(entity => {
        if (entity.vehicle && entity.vehicle.position) {
          const id = entity.id;
          const lat = entity.vehicle.position.latitude;
          const lng = entity.vehicle.position.longitude;
          const line = entity.vehicle.trip && entity.vehicle.trip.route_id ? entity.vehicle.trip.route_id : "Nieznana linia";

          // jeśli marker już istnieje – przesuń
          if (markers[id]) {
            markers[id].setLatLng([lat, lng]);
          } else {
            // nowy marker
            markers[id] = L.circleMarker([lat, lng], {
              radius: 6,
              color: color,
              fillColor: color,
              fillOpacity: 0.8
            }).addTo(map)
              .bindPopup(`Linia: ${line}`);
          }
        }
      });

    } catch (err) {
      console.error('Błąd pobierania GTFS‑RT:', err);
    }
  }

  async function updateVehicles() {
    await loadGTFSRT('https://gtfs.ztp.krakow.pl/VehiclePositions_A.pb', busMarkers, 'blue'); // autobusy
    await loadGTFSRT('https://gtfs.ztp.krakow.pl/VehiclePositions_T.pb', tramMarkers, 'red');  // tramwaje
  }

  // aktualizacja co 15 sekund
  updateVehicles();
  setInterval(updateVehicles, 15000);
</script>
</body>
</html>
