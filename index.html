<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tysiąc Card Game</title>
    <style>
        body {font-family: Arial, sans-serif;}
        .card {display: inline-block; margin: 10px; padding: 20px; border: 1px solid #ccc; border-radius: 5px;}
        #game {text-align: center;}
    </style>
</head>
<body>
    <div id="game">
        <h1>Tysiąc Card Game</h1>
        <div id="deck"></div>
        <div id="players">
            <div id="player1" class="card">Player 1: <span id="score1">0</span></div>
            <div id="player2" class="card">Player 2: <span id="score2">0</span></div>
        </div>
        <button id="deal">Deal Cards</button>
        <button id="play">Play Round</button>
    </div>
    <script>
        const deck = [...Array(24).keys()].map(i => `Card ${i + 1}`); // Sample cards
        let player1Score = 0;
        let player2Score = 0;
        const deckElement = document.getElementById('deck');

        document.getElementById('deal').onclick = function() {
            // Shuffle and deal logic here
            deckElement.innerHTML = deck.join(', ');
        };

        document.getElementById('play').onclick = function() {
            // Game logic here - point counting according to Tysiąc rules
            player1Score += Math.floor(Math.random() * 10);
            player2Score += Math.floor(Math.random() * 10);
            document.getElementById('score1').innerText = player1Score;
            document.getElementById('score2').innerText = player2Score;
        };
    </script>
</body>
</html>
