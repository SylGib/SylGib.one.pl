<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraków Transport Live</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Twoje style -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    
    <style>
        /* Tymczasowe style dla markerów */
        .vehicle-marker {
            background: none !important;
            border: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Nagłówek -->
        <header class="header">
            <div class="header-left">
                <h1><i class="fas fa-subway"></i> Kraków Transport Live</h1>
                <div class="theme-switch-wrapper">
                    <label class="theme-switch" for="theme-checkbox">
                        <input type="checkbox" id="theme-checkbox" checked>
                        <div class="slider round">
                            <span class="sun">☀️</span>
                            <span class="moon">🌙</span>
                        </div>
                    </label>
                    <span id="theme-label">Tryb ciemny</span>
                </div>
            </div>
            
            <div class="header-right">
                <div class="stats">
                    <span class="stat-item">
                        <i class="fas fa-bus" style="color:#2ecc71"></i>
                        <span id="bus-count">0</span>
                    </span>
                    <span class="stat-item">
                        <i class="fas fa-train" style="color:#e74c3c"></i>
                        <span id="tram-count">0</span>
                    </span>
                    <span class="stat-item">
                        <i class="fas fa-clock"></i>
                        <span id="update-time">-:--</span>
                    </span>
                </div>
                
                <div class="controls">
                    <button id="refresh-btn" class="btn btn-primary">
                        <i class="fas fa-sync-alt"></i> Odśwież
                    </button>
                </div>
            </div>
        </header>

        <!-- Główna zawartość -->
        <main class="main-content">
            <!-- Mapa -->
            <div class="map-section">
                <div id="map"></div>
                <div class="map-controls">
                    <button id="locate-btn" class="map-btn" title="Moja lokalizacja">
                        <i class="fas fa-location-arrow"></i>
                    </button>
                    <button id="zoom-in" class="map-btn" title="Przybliż">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button id="zoom-out" class="map-btn" title="Oddal">
                        <i class="fas fa-minus"></i>
                    </button>
                </div>
            </div>
            
            <!-- Panel boczny -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3><i class="fas fa-info-circle"></i> Informacje</h3>
                    <div class="info-box">
                        <p>Dane z: <strong>MPK Kraków</strong></p>
                        <p>Ostatnia aktualizacja: <span id="last-update">-</span></p>
                        <p>Pojazdy online: <span id="vehicles-online">0</span></p>
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <h3><i class="fas fa-filter"></i> Filtry</h3>
                    <div class="filters">
                        <label class="checkbox-label">
                            <input type="checkbox" id="show-buses" checked>
                            <span class="checkmark bus"></span>
                            Autobusy
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="show-trams" checked>
                            <span class="checkmark tram"></span>
                            Tramwaje
                        </label>
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <h3><i class="fas fa-list"></i> Aktywne linie</h3>
                    <div id="lines-list" class="lines-list">
                        <!-- Lista linii będzie generowana dynamicznie -->
                    </div>
                </div>
            </aside>
        </main>
        
        <!-- Stopka -->
        <footer class="footer">
            <p>Dane: <a href="https://gtfs.ztp.krakow.pl/" target="_blank">MPK Kraków</a> • 
               Mapa: © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a></p>
        </footer>
    </div>

    <!-- Skrypty -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/map.js"></script>
    <script src="js/gtfs.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
