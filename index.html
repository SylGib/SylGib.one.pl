<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>TTSS Kraków – live</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    #map {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- GTFS-Realtime decoder -->
<script src="https://cdn.jsdelivr.net/npm/gtfs-realtime-bindings/dist/gtfs-realtime-bindings.min.js"></script>

<script>
/* ================================
   🔧 KONFIGURACJA
================================ */

// ⛔ ZMIEŃ NA SWÓJ WORKER
const PROXY_URL = "https://gtfs-ttss.pages.dev";

// GTFS-RT Kraków
const BUS_URL  = "https://gtfs.ztp.krakow.pl/VehiclePositions_A.pb";
const TRAM_URL = "https://gtfs.ztp.krakow.pl/VehiclePositions_T.pb";

// co ile ms odświeżać
const REFRESH_MS = 15000;

/* ================================
   🗺️ MAPA
================================ */

const map = L.map("map").setView([50.0647, 19.9450], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

/* ================================
   🚍 MARKERY
================================ */

const buses = {};
const trams = {};

const busIcon = L.circleMarker([0,0], {
  radius: 6,
  color: "blue",
  fillColor: "blue",
  fillOpacity: 0.8
});

const tramIcon = L.circleMarker([0,0], {
  radius: 6,
  color: "red",
  fillColor: "red",
  fillOpacity: 0.8
});

/* ================================
   📡 GTFS-RT
================================ */

async function loadVehicles(url, store, color) {
  try {
    const res = await fetch(
      `${PROXY_URL}/?url=${encodeURIComponent(url)}`
    );

    const buffer = await res.arrayBuffer();
    const feed = GtfsRealtimeBindings.FeedMessage.decode(
      new Uint8Array(buffer)
    );

    feed.entity.forEach(e => {
      if (!e.vehicle || !e.vehicle.position) return;

      const id = e.id;
      const lat = e.vehicle.position.latitude;
      const lon = e.vehicle.position.longitude;
      const line =
        e.vehicle.trip && e.vehicle.trip.route_id
          ? e.vehicle.trip.route_id
          : "?";

      if (store[id]) {
        store[id].setLatLng([lat, lon]);
      } else {
        store[id] = L.circleMarker([lat, lon], {
          radius: 6,
          color: color,
          fillColor: color,
          fillOpacity: 0.9
        })
          .bindPopup(`Linia: ${line}`)
          .addTo(map);
      }
    });

  } catch (err) {
    console.error("GTFS error:", err);
  }
}

async function update() {
  loadVehicles(BUS_URL, buses, "blue");
  loadVehicles(TRAM_URL, trams, "red");
}

update();
setInterval(update, REFRESH_MS);
</script>

</body>
</html>
